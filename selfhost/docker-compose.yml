# The Supabase-shaped database the apps talk to, without Supabase: Postgres 17 and PostgREST (the
# same REST server Supabase runs). The gateway in front of it (Caddy: /rest/v1 for a known apikey,
# like Supabase's gateway) lives in thehimmat/atthebunga-server and reaches PostgREST as `rest` on
# the api-edge network. See selfhost/README.md.
#
# The name is pinned because the volumes are named after it (selfhost_pgdata): without it, Compose
# would take the folder's name, and a checkout in another folder would start on an empty database.
name: selfhost

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in selfhost/.env}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?set in selfhost/.env}
    # pg_prewarm's autoprewarm worker saves the list of cached blocks every 5 minutes and loads them
    # back at startup, so the first searches after a restart don't read lines from disk (README, Memory).
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-256MB}", "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}", "-c", "shared_preload_libraries=pg_prewarm"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./sql:/selfhost/sql:ro
    # Local only: pipelines and psql reach it through an SSH tunnel, never the internet.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,akhar # akhar: the annotation site (gurmukhi-akhar-ocr), via AKHAR_KEY
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set in selfhost/.env}
      PGRST_DB_MAX_ROWS: "1000" # Supabase's default; the apps page at 1000 (lib/fetch-all-rows)
      PGRST_DB_POOL: "20"
      PGRST_ADMIN_SERVER_PORT: "3001" # /ready answers 200 once the database is reachable
      PGRST_DB_TX_END: commit-allow-override # lets a request ask for rollback (tests on a live server)
    # Only PostgREST shares a network with the gateway, so Postgres stays out of its reach.
    networks: [default, api-edge]

# selfhost_caddy_data (Caddy's certificates) is no longer declared here: atthebunga-server's gateway
# uses it as an external volume, and leaving it out keeps a `down -v` here from deleting it.
volumes:
  pgdata:

# Made by atthebunga-server's host-setup.sh (locally: docker network create api-edge).
networks:
  api-edge:
    name: api-edge
    external: true
