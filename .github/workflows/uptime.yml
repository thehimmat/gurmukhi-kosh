name: Uptime

# Every 30 minutes: the self-hosted API's /health (selfhost/Caddyfile) answers 200 only when
# PostgREST is up and reaches the database, and the site's home page answers through Cloudflare.
# Daily at 08:00 UTC: the dictionary's /api/health report (it replaced the Vercel cron). A failed run
# is GitHub's email that something is down.
# Repository variables (Settings → Secrets and variables → Actions → Variables) turn the checks on:
# KOSH_API_URL (https://141-148-39-45.sslip.io) and SITE_URL (https://search.atthebunga.com).

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  api:
    if: ${{ vars.KOSH_API_URL != '' && github.event.schedule != '0 8 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors -o /dev/null -w "%{http_code} in %{time_total}s\n" "${{ vars.KOSH_API_URL }}/health"

  site:
    if: ${{ vars.SITE_URL != '' && github.event.schedule != '0 8 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors -o /dev/null -w "%{http_code} in %{time_total}s\n" "${{ vars.SITE_URL }}/"

  health-report:
    if: ${{ vars.SITE_URL != '' && github.event.schedule != '*/30 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        run: curl -fsS --retry 2 --retry-delay 30 --retry-all-errors -o /dev/null -w "%{http_code} in %{time_total}s\n" "${{ vars.SITE_URL }}/api/health"
