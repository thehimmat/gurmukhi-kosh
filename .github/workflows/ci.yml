name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration-rls-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check migrations enable RLS on every created table
        run: node scripts/check-migrations-rls.mjs

  tests:
    runs-on: ubuntu-latest
    env:
      # Public client-side values (shipped in every browser bundle of the
      # deployed site); RLS is the security boundary, not these strings.
      NEXT_PUBLIC_SUPABASE_URL: https://brczghxvpfikezsevbkh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyY3pnaHh2cGZpa2V6c2V2YmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODE0NDgsImV4cCI6MjA5NDk1NzQ0OH0.g8PHrRaWECquYUUyv_KiC4MdVmOffSFA0O3Jgg6NRuY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci against the standalone lockfile, so CI and Vercel build the
      # exact pinned dependency graph (including @atthebunga/gurmukhi-input,
      # which local dev resolves via the suite workspace symlink instead).
      # Local installs still go through the suite's npm-workspace root (../);
      # after any dependency change here, refresh the lockfile with:
      #   npm run lockfile:refresh
      - run: npm ci --no-audit --no-fund
      - name: Every active user story has a story-tagged test
        run: node scripts/check-stories.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build compiles
        run: npm run build
      - name: Test suite (unit + live-DB + prod integration)
        run: npm test
