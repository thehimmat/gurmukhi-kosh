name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration-rls-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check migrations enable RLS on every created table
        run: node scripts/check-migrations-rls.mjs
