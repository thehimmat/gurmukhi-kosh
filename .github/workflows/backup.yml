name: Weekly database backup

# A pg_dump of the production database, encrypted, kept as a workflow artifact for 90 days
# (about 12 weekly copies). The repo is public and artifacts are readable by anyone who can read it,
# so the dump is only ever stored encrypted: it holds curator-only texts. Restore steps:
# supabase/BACKUP.md, or selfhost/scripts/restore.sh --gpg.
#
# Two sources:
#   - The self-hosted server (selfhost/), when KOSH_BACKUP_URL is set: it dumps and encrypts
#     nightly itself (selfhost/scripts/backup.sh) and this copies the latest file offsite, failing
#     if it's more than two days old, so a stopped nightly backup turns this red.
#   - Otherwise Supabase, dumped here.
#
# Secrets:
#   KOSH_BACKUP_URL     https://<api>/backups/<BACKUP_TOKEN>/latest.dump.gpg (printed by the server)
#   SUPABASE_DB_URL     session-pooler connection string (port 5432), from the dashboard's
#                       Connect button. The direct db.<ref> host is IPv6-only, which runners lack.
#   BACKUP_PASSPHRASE   long random passphrase; keep a copy outside GitHub or the backups are lost.
#                       The server encrypts with the same one (selfhost/backup.pass).

on:
  schedule:
    - cron: "17 9 * * 0" # Sundays 09:17 UTC
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Postgres 17 client tools (the server's major version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Fetch or dump, encrypted
        env:
          KOSH_BACKUP_URL: ${{ secrets.KOSH_BACKUP_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::BACKUP_PASSPHRASE secret is not set"; exit 1; }
          set -o pipefail
          name="kosh-$(date -u +%Y-%m-%d).dump.gpg"
          if [ -n "$KOSH_BACKUP_URL" ]; then
            curl -fsS --retry 3 -o "$name" -D headers.txt "$KOSH_BACKUP_URL"
            modified=$(grep -i '^last-modified:' headers.txt | cut -d' ' -f2- | tr -d '\r')
            age_h=$(( ($(date -u +%s) - $(date -u -d "$modified" +%s)) / 3600 ))
            echo "server backup from $modified ($age_h h old)"
            test "$age_h" -le 48 || { echo "::error::the server's latest backup is $age_h hours old; its nightly backup has stopped"; exit 1; }
          else
            test -n "$SUPABASE_DB_URL" || { echo "::error::set KOSH_BACKUP_URL or SUPABASE_DB_URL"; exit 1; }
            # Custom format (compressed; pg_restore can pick tables, and drop owners and grants at
            # restore time), schemas the app owns only: Supabase recreates auth/storage itself.
            /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
                --format=custom \
                --schema=public --schema=akhar --schema=supabase_migrations \
              | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                    --passphrase-fd 3 --output "$name" 3<<<"$BACKUP_PASSPHRASE"
          fi
          # A dump that failed part-way is short: refuse anything implausibly small.
          size=$(stat -c %s "$name")
          echo "$name: $((size / 1048576)) MB"
          test "$size" -gt 20000000 || { echo "::error::dump is only $size bytes"; exit 1; }
          # Prove it decrypts in full (gpg checks its integrity at the end) and pg_restore can read
          # its table of contents. To a file, not a pipe: pg_restore --list stops reading after the
          # table of contents, which would break gpg's pipe and fail the step.
          gpg --batch --quiet --pinentry-mode loopback --decrypt --passphrase-fd 3 \
              --output check.dump "$name" 3<<<"$BACKUP_PASSPHRASE"
          /usr/lib/postgresql/17/bin/pg_restore --list check.dump > toc.txt
          rm check.dump
          grep -q "TABLE DATA public lines" toc.txt
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          retention-days: 90
          compression-level: 0 # already compressed and encrypted
