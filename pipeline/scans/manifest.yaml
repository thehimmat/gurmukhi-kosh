  notes: 'Printed page = PDF page (offset 0). Typeset digitally in Satluj (body) with some Sarover/Satluj-Bold;
    Latin digits A-J in the Satluj glyphs stand for 1-0 in a few places. The supplied legacy2uni.js (GurbaniAkhar)
    does NOT handle this font. I wrote a best-effort Satluj mapper (scratchpad/tools/E_satluj.py). Converted full
    text: scratchpad/triage/E_work/nangali.txt. It is good enough for search, but needs QA before ingestion: ੍ਹ/ੈ,
    ਞ and some ligatures are imperfect. Items 1-12 are a standard Nihang/Taksal nitnem (SGGS + Dasam) and all online.
    Items 13-37 are the ''obscure banis'' the user mentioned. The editors call them asfotak banis of Guru Gobind
    Singh, gathered by Giani Hardeep Singh (Hazur Sahib) from Patna/old birs and Sarbloh manuscripts. Gobind Gita
    was omitted for length and is printed separately by the Kashi Shastris. NEW CORPUS CANDIDATES (not in BaniDB):
    Sri Sarbloh Astotar, Brahm Kavach, Sarbloh Kavach, Sarbloh Kavach Astotar, Bhagauti di Var, Malkauns ki Var,
    Sansahar Sukhmana, Sant Kaj, Rajput Ghore, Asfotak Kabitt, Vahiguru Mantra Mahatam, Guru Gadi Patshahi Dasak,
    Savaiye Khalsa Prakash ke, Fatehnama, Mool Mantar Khalsa, most of Guru Granth Sthapan, the Persian rehat couplets,
    and much of Khalsa Mahima (Sarbloh-type), Shastar Nam Mala Mantra and Amrit Bidhi. Kal Astotar, Bhagauti Astotar
    and Ugardanti exist in BaniDB (Charitar 404; Dasam appendix ang 1428) but this text differs heavily. Since this
    gutka is born-digital, it is the best ingest source for these items. Decision ''collection'' for the gutka as
    a whole, but split out the not_found items as ingest-candidates (tier gurbani by attribution, though authenticity
    is contested; Mool Mantar Khalsa probably historical). Sarbloh-labelled items should be reconciled with group
    C.'
