  notes: 'Printed pothi-page offset: PDF = printed + 13 up to about printed p.47 (PDF 60), then + 15 (from about
    PDF 66 to PDF 124, printed 109), then + 17 from about PDF 130 (printed 113) to PDF 181 (printed 164). Some extra
    leaves and decorated half-title plates cause the jumps; the section boundaries above are ±1 page. PDF 182 is
    the back cover. The PDF has no text layer (exported from Word as images). RUBRICS (TOC notes): items 1-19 are
    read akhand over the nine days, but Ram Avtar is not read in full each day. The whole Ram Avtar is read only
    on Dasehra. On Dasehra the 1-19 sequence is not read, only: item 1 Jaap (pp.1-9), item 17 Mahakal dohra + Benti
    Chaupai ''ਹਮਰੀ ਕਰੋ ਹਾਥ ਦੈ ਰੱਛਾ'' (pp.105-109), item 19 Ram Avtar katha (pp.110-164), and item 13 (33 Savaiye,
    1 to 4, pp.95-98) before the bhog. The full bidhi is on the page after the TOC (PDF 13). SAME POTHI AS HAZUR?
    No. The two are distinct editions of the same tradition. This is the Budha Dal original (1980, reprinted 1999).
    The Hazur Sahib 2009 printing copies its format but differs in selection: Budha Dal adds Akal Ustat 201-210,
    Gian Prabodh tomar 320-333, the Paras Nath bhujang, the Zafarnama/Hikayat saqi couplets and the Nihkalanki closing
    verses. Hazur has 32 Savaiye (numbered from ''ਸੱਤ ਸਦੈਵ'') and Nihkalanki sirkhandi. Both are wholly Dasam Granth,
    so collection only, with no new corpus.'
