# Triage of the user's scanned PDFs (Drive: Gurbani Docs / Santhiā), 2026-10-06.
#
# One entry per PDF: what it is, its edition and scan quality, its sections with
# PDF page ranges, and whether each Gurbani section is already in BaniDB.
# See README.md for the decisions this follows (BaniDB canonical; other editions
# are witnesses; compilations are collections; tiers gurbani/historical/reference).
#
# decision:
#   witness           - BaniDB already has the text; keep this edition for comparing readings
#   ingest-candidate  - no online source; this scan would become the canonical text
#   collection        - a compilation: an ordered list of references plus rubrics
#   reference-only    - not corpus (translation-only, pronunciation, music, prosody)
#   skip              - not useful for the kosh, a duplicate, or personal material
#
# Readings from scans without a text layer were read off page images and checked with
# `npm run scans:check`; single-vowel-sign variants from low-resolution renders are tentative.

