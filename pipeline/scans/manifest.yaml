  notes: 'Dasam Granth extracts recited at the Dasehra Shastar Puja. Offset: PDF = printed + 10 up to printed p.82
    (PDF 92), then printed + 11 (an extra leaf around PDF 93). PDF 179 is the back cover. INCOMPLETE SCAN: the TOC
    lists three day-10 items on pothi pp.169-274 (18 Jaap Sahib 169-181; 19 whole Ram Avtar chaupai 1-864 182-269;
    20 Tria Charitar dohra 366-376 + Benti Chaupai 377-405 270-274) and none of them is in the PDF, which stops
    at printed p.167. RUBRICS (PDF 10, ''ਗ''): (ੳ) for the first nine days, begin on the first Navratra of Assu
    in the last pahar (after 12 noon) and read the whole path akhand. One or more Singhs may read it in relays,
    after bathing, in clean clothes and sitting on a mat. Read only pothi pp.1-167 for the nine days. Fix a time
    in the last pahar each day and begin with an Ardas. Offer karah prasad and Shaheedi Degh at the start, middle
    and end. On the other days distribute seven kinds of dry fruit. Keep dhoop and a jot burning and a kumbh with
    a coconut from start to finish each day. TOC note: ''all the banis above are to be read on the first (nine)
    days''. (ਅ) On Dasehra (tenth Navratra), read only Jaap (pp.169-191), the whole Ram Avtar (192-269) and dohra
    ''ਮਹਾਕਾਲ ਕੀ ਜੇ ਸਰਨਿ ਪਰੇ'' (270-274), then Aarta-Aarti and Ardas. Begin that day in the morning, not the last
    pahar. RELATION TO ''Dushera Mahatam Pothi.pdf'': not the same scan or edition. This is the 2009 Takht Hazur
    Sahib printing. Its TOC layout (chapter / chhand / opening line / verse range / pothi page / Dasam-1428 page)
    and bidhi copy the Budha Dal pothi, but the selection differs (see that entry). No text was found that is missing
    from BaniDB.'
