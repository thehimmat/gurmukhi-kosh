    variants_observed: 'Same text, systematically different transliteration. The scan follows Indo-Persian (classical)
      vowels: yā/wāw-e majhūl written ੇ/ੋ where BaniDB writes ੀ/ੂ (ਨਮੇ/ਨਮੀ, ਮੇ/ਮੀ, ਨੇਸ੍ਤ/ਨੀਸਤ, ਤੋ/ਤੂ, ਦੋਸਤ/ਦੂਸਤ);
      poet''s name ਗੋਇਆ vs BaniDB ਗੋਯਾ; nasal noon written with bindi (ਈਂ, ਜਹਾਂ, ਆਂ) where BaniDB uses ਣ (ਈਣ, ਜਹਾਣ,
      ਆਣ); silent final he written ਹ (ਜੁਮਲਹ, ਗਸ਼ਤਹ, ਦੀਦਹ) vs BaniDB ਾ (ਜੁਮਲਾ, ਗਸ਼ਤਾ, ਦੀਦਾ); ਕਿ: / ਚਿ: with visarga
      vs BaniDB ਕਿ/ਕਿਹ, ਚਿ/ਚਿਹ; half-letters ਅਸ੍ਤ/ਨੇਸ੍ਤ vs ਅਸਤ/ਨੀਸਤ; doubled consonant marked (ਸ਼ਵੱਦ, ਕੁਨੱਦ) vs
      ਸ਼ਵਦ/ਕੁਨਦ; heavier nukta use (ਕ਼, ਅ਼); izafat shown with ਿ plus hyphens and commas. Genuine readings also
      differ, e.g. ghazal 1.1 scan ''ਵਗਰਨਹ, ਜ਼ੂਕਿ਼ ਚੁਨੀਂ ਆਮਦਨ, ਨਬੂਦ ਮਰਾ'' vs BaniDB ''ਵਗਰਨਾ ਜ਼ੋਕਿ ਚੁਨੀਂ ਨ ਬੂਦ ਮਰਾ'';
      ghazal 52.6 scan ''ਫ਼ਾਲਿ ਮੁਬਾਰਕ'' vs BaniDB ''ਕਾਲ ਮੁਬਾਰਿਕ'' (BaniDB looks like a typo); ghazal 52 has 8 couplets
      in the scan vs 7 in BaniDB. One alternative reading is given inline in parentheses (p11: ''ਈਂ (ਅਈਂ) ਮਤਾਇ ਹੱਕ'').'
    notes: 'Mapped every scan ghazal to BaniDB by first line (local fuzzy match against the N shabad list) plus
      scans:check on ghazal 1 (online, 30000, 0.85-0.96). Order and coverage: scan 1-6 = BaniDB 1-6; scan 7, 8,
      9 = BaniDB 8, 9, 7 (BaniDB''s 7th, ''ਗਦਾਇ ਕੂਇ ਤੁਰਾ'', is the scan''s 9th); scan 10-60 = BaniDB 10-60; scan
      61 ''ਗਿਰੀਆਂ ਸ਼ੁਦਾ ਇੰਦਲੀਬ, ਅਜ਼ ਨਿਗਾਹਿ ਤੋ'' (p63) is NOT in BaniDB (scans:check not_found); scan 62 ''ਸਾਕੀ,
      ਮਰਾ ਤੋ, ਜੁੱਰਾ-ਇ ਜਾਂ'' = BaniDB 30061 (numbered 62); scan 63 ''ਬੇਵਫ਼ਾ ਨੇਸ੍ਤ ਕਸੇ'' = BaniDB 30060 (numbered
      61) AND again 30062 (numbered 63). So BaniDB has 63 ghazal shabads but only 62 distinct ghazals (30062 is
      a duplicate of 30060, and its spelling (ਕਿ:, ਨੇਸਤ, ਨਸਾਰਿ) matches this scan''s edition, suggesting it was
      keyed from the same edition). Distinct ghazals overall: 61 shared with BaniDB''s 1-61 numbering + ''Saqi mara
      to'' (both have it as 62) + ''Giriyan shuda andalib'' (scan only) = 63. Whether the two ghazals beyond 61
      come from works other than the Diwan cannot be settled from this file: it gives no source notes for them;
      the classic Diwan-e-Goya count is usually given as 61 (not verified here). None of the 63 come from Zindagi
      Nama, Ganj Nama or Joti Bigas (those are masnavi couplets, and the scan''s ghazals did not match them).'
